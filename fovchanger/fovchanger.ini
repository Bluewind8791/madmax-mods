; FovChanger settings. Restart the game after changing this file.
[FovChanger]
; Field of view multiplier at game start. 1.0 = game default. Range 0.5 - 2.0.
Multiplier=1.2
; Change of the multiplier per key press.
Step=0.05
; Keys as Windows virtual-key codes (decimal). 0 = no key.
; 112 = F1 (turn the mod on/off), 187 = =/+ key, 189 = - key (main keyboard row).
; Numpad: 107 = Numpad +, 109 = Numpad -.
ToggleKey=112
IncreaseKey=187
DecreaseKey=189
